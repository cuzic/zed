name: GPUI Windows IME queue regression
on:
  push:
    branches: [verify/windows-ime-unit]
permissions:
  contents: read
jobs:
  order:
    name: ${{ matrix.name }}
    runs-on: windows-2025
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Before fix (expected failure)
            revision: c3c1bbc
          - name: After fix (expected pass)
            revision: '44632ba'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 4
          persist-credentials: false
      - name: Compile the GPUI queue module directly
        shell: pwsh
        run: |
          git checkout --detach ${{ matrix.revision }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustc +stable --edition 2024 --test crates/gpui_windows/src/foreground_input.rs -o ime-order-test.exe
      - name: Check that an IME commit precedes the following key
        run: .\ime-order-test.exe --nocapture
