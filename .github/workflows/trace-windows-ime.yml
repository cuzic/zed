name: Trace Zed Windows IME timing
on:
  push:
    branches: [diagnose/windows-ime-timing, diagnose/windows-ime-timing-ab]
permissions:
  contents: read
jobs:
  trace:
    runs-on: windows-2022
    timeout-minutes: 100
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_DEV_BUILD_OVERRIDE_DEBUG: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prepare Rust
        run: rustup toolchain install 1.100.0 --profile minimal
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: zed-ime-deps-windows-2022-${{ hashFiles('Cargo.lock') }}
      - name: Build traced Zed
        run: |
          cargo +1.100.0 build --locked -p zed --bin zed --config 'profile.dev.package.gpui_windows.debug-assertions=false'
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        with:
          name: traced-zed-exe
          path: target/debug/zed.exe
          retention-days: 7
      - name: Install Mozc Readable
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./ime-replay/install-mozc.ps1 -Tag v3.35.6354-readable.1 -OutDir "$env:RUNNER_TEMP/mozc"
      - name: Replay timed commits, upstream and IME-first drain alternating
        shell: powershell
        run: |
          $summary = @()
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/ab" | Out-Null
          foreach ($round in 1..4) {
            foreach ($order in @('upstream', 'ime-first')) {
              $name = "$order-$round"
              $out = Join-Path $env:RUNNER_TEMP "ab/$name"
              $env:GPUI_IME_FOREGROUND_ORDER = $order
              cmd /c "python ime-replay/terminal.py target/debug/zed.exe `"$out`" --lines 40000 > `"$env:RUNNER_TEMP\ab\$name.log`" 2>&1"
              $status = $LASTEXITCODE
              Get-Content "$env:RUNNER_TEMP/ab/$name.log"
              $summary += "$name exit=$status " + ((Get-Content "$env:RUNNER_TEMP/ab/$name.log" | Select-String 'REPRODUCED|INVALID') -join ' | ')
            }
          }
          Remove-Item Env:GPUI_IME_FOREGROUND_ORDER
          $summary | Tee-Object "$env:RUNNER_TEMP/ab/summary.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zed-ime-timing-ab
          path: |
            ${{ runner.temp }}/ab/*.log
            ${{ runner.temp }}/ab/summary.txt
            ${{ runner.temp }}/ab/*/zed.stderr
            ${{ runner.temp }}/ab/*/results.json
